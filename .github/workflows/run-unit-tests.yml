name: Unit Tests
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
  pull_request:
    branches:
      - main
      - production

jobs:
  run-unit-tests:
    name: ${{ github.event.head_commit.message || github.event.pull_request.title }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @vitrine-academica/api test:unit:run
